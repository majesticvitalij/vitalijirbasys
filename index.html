<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Šaldytuvas ir šilumos siurblys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one slide at a time inside a fixed app frame; thermal duality (cold left, hot right) drives colour, motion and the molecule field. */
:root{
  --bg:#03050d; --surface:rgba(10,17,38,.78); --surface2:rgba(24,38,72,.7); --fg:#eaf2ff; --muted:#a4b6d2; --line:rgba(130,160,220,.24);
  --cold:#6dd0ff; --hot:#ff9360; --ok:#3ddbb0; --bad:#ff7b72; --wood:#b97a3e;
  --a1:#d6404c; --a2:#2a6fd0; --a3:#f2a900; --a3ink:#1b1400; --a4:#0c8a6a;
  --shadow:0 12px 34px rgba(0,0,0,.5);
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;overflow:hidden;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cold);outline-offset:2px;border-radius:6px}
.app{height:100%;display:flex;flex-direction:column;position:relative}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.glow{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(55% 45% at 12% 8%,rgba(90,70,200,.26),transparent 70%),
  radial-gradient(50% 45% at 92% 88%,rgba(210,80,150,.16),transparent 70%),
  radial-gradient(70% 60% at 50% 50%,transparent 40%,rgba(2,3,10,.55) 100%)}
.card,.stat,.side,.step,.qtext,.tabs,.chip,.seg,.ico,.partbtns button,.nick,.stat{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

/* top bar */
.top,.bot{position:relative;z-index:3;display:flex;align-items:center;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{padding-block:10px 8px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font:700 13px/1 var(--display);letter-spacing:.02em;min-width:0}
.brand svg{flex:none}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;padding:6px 11px;border-radius:999px;font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ico{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.ico:active{transform:scale(.92)}
.prog{position:relative;z-index:3;height:3px;background:var(--line);margin-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cold),var(--hot));transition:width .6s cubic-bezier(.2,.7,.2,1)}

/* stage */
.stage{position:relative;z-index:2;flex:1;min-height:0}
.slide{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;opacity:0;visibility:hidden;transform:translateX(5%);transition:opacity .45s ease,transform .6s cubic-bezier(.2,.7,.2,1),visibility 0s .6s;-webkit-overflow-scrolling:touch}
.slide.before{transform:translateX(-5%)}
.slide.active{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.wrap{max-width:1080px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 28px max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.slide.active .r{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms + 100ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(30px,7.4vw,68px);line-height:1.04;font-weight:700}
h2{font-size:clamp(22px,4.8vw,38px);line-height:1.12;font-weight:700}
h3{font-size:clamp(16px,2.6vw,20px);line-height:1.2;font-weight:700}
p{margin:0}
.kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cold)}
.lead{font-size:clamp(16px,2.3vw,19px);color:var(--muted);max-width:60ch}
.cold{color:var(--cold)}.hot{color:var(--hot)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:22px 32px;align-items:center}
.stack{display:grid;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:16px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:13px}
.btn{border:0;cursor:pointer;border-radius:14px;padding:13px 20px;font-weight:800;font-size:15px;background:var(--fg);color:var(--bg);display:inline-flex;align-items:center;gap:10px;transition:transform .15s,box-shadow .2s;box-shadow:0 6px 0 color-mix(in srgb,var(--fg) 30%,transparent)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--fg) 30%,transparent)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:default}

/* hero */
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:26px 40px;align-items:center;min-height:100%}
.hero h1 .l2{display:block;background:linear-gradient(90deg,var(--cold),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .stack{gap:18px}
.duo-photos{display:flex;justify-content:center;gap:14px;padding:6px 8px}
.pcard{width:min(44%,230px);flex:none;transform:rotate(var(--rot,0deg));transition:transform .4s cubic-bezier(.2,.7,.2,1)}
.pcard:nth-child(1){--rot:-3.5deg;margin-top:14px}.pcard:nth-child(2){--rot:3deg}
.pcard:hover{transform:rotate(0) translateY(-6px) scale(1.02)}
.pcard .ph{aspect-ratio:3/4;border-radius:16px;overflow:hidden;border:4px solid var(--surface);box-shadow:var(--shadow);background:var(--surface2)}
.pcard img,.acard img{width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block}
.pcard .nm{margin-top:10px;font-weight:800;font-size:14px;line-height:1.2;text-align:center}
.pcard .nm small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.hint{font-size:13px;color:var(--muted)}

/* authors */
.acards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.acard{display:flex;gap:16px;align-items:stretch}
.acard .ph{flex:0 0 38%;max-width:190px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--surface2)}
.acard .tx{display:flex;flex-direction:column;gap:10px;justify-content:center;min-width:0}
.acard h3{font-size:clamp(17px,3.4vw,22px)}
.acard p{color:var(--muted);font-size:14.5px}
.plan{display:flex;flex-wrap:wrap;gap:8px}
.plan .chip{cursor:pointer}.plan .chip:hover{border-color:var(--cold)}
.src{font-size:14px;color:var(--muted)}.src b{color:var(--fg)}

/* evaporation */
.flask-wrap{display:grid;place-items:center;gap:12px}
.flask{width:min(100%,300px);height:auto}
.flask .bub{fill:color-mix(in srgb,var(--cold) 35%,transparent);stroke:var(--cold);stroke-width:1.5;opacity:0}
.boil .bub{opacity:1;animation:bub 1.8s linear infinite}
@keyframes bub{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
.flask .frost{opacity:0;transition:opacity 2.2s ease .3s}.boil .frost{opacity:1}
.flask .merc{transition:transform 2.6s cubic-bezier(.3,.7,.2,1);transform-origin:bottom;transform-box:fill-box}
.boil .merc{transform:scaleY(.38)}
.flask .liq{fill:color-mix(in srgb,var(--cold) 26%,transparent)}
.boil .liq{animation:slosh 1.4s ease-in-out infinite}
@keyframes slosh{50%{transform:translateY(-2px)}}
.flask .air{opacity:0;transition:opacity .6s}.boil .air{opacity:1;animation:airmove 1.2s linear infinite}
@keyframes airmove{from{stroke-dashoffset:0}to{stroke-dashoffset:-18}}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{flex:1 1 130px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 26px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.state{font-weight:800;font-size:14px;color:var(--cold);min-height:1.5em}

/* fridge diagram */
.cyc{width:100%;height:auto;display:block}
.cyc text{font:700 11px var(--body);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.cyc .rg{font-weight:800;font-size:10px;letter-spacing:.08em;text-transform:uppercase;fill:var(--muted)}
.cyc .pipe{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.cyc .pc{stroke:var(--cold)}.cyc .ph2{stroke:var(--hot)}
.cyc .part{cursor:pointer;outline:none}
.cyc .ring{fill:none;stroke:var(--fg);stroke-width:1.6;stroke-dasharray:4 4;opacity:0;transition:opacity .25s}
.cyc .part.sel .ring,.cyc .part:focus-visible .ring{opacity:.9}
.cyc .dotp{fill:var(--fg);stroke:var(--surface);stroke-width:1.5}
.partbtns{display:flex;flex-wrap:wrap;gap:8px}
.partbtns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.partbtns button i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.partbtns button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pdesc{min-height:92px}
.pdesc h3{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.pdesc h3 i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700}
.legend span{display:flex;gap:8px;align-items:center}.legend i{width:22px;height:5px;border-radius:3px}
.note{font-size:14.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* devices */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;flex-wrap:wrap}
.tabs button{flex:1 1 120px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-weight:800;font-size:14px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.duo{display:grid;grid-template-columns:1fr 64px 1fr;gap:10px;align-items:stretch}
.side{border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;justify-content:center;min-width:0;overflow-wrap:anywhere}
.side small{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
.side b{font-size:clamp(14px,3.6vw,17px);line-height:1.25}
.side.cold{background:color-mix(in srgb,var(--cold) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--cold) 45%,transparent)}
.side.cold small{color:var(--cold)}
.side.hot{background:color-mix(in srgb,var(--hot) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--hot) 45%,transparent)}
.side.hot small{color:var(--hot)}
.mid{display:grid;place-items:center}
.flowbar{height:8px;border-radius:8px;margin-top:6px;background:repeating-linear-gradient(90deg,var(--cold) 0 14px,transparent 14px 26px);background-size:26px 8px;animation:march .9s linear infinite;mask:linear-gradient(90deg,#000 0,#000 100%);opacity:.85;position:relative}
.flowbar::after{content:"";position:absolute;right:-2px;top:50%;translate:0 -50%;border-left:14px solid var(--hot);border-block:10px solid transparent}
@keyframes march{to{background-position:26px 0}}
.flowcap{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:8px}

/* heat pump */
.bars{display:grid;gap:14px}
.brow .bl{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;font-weight:700;margin-bottom:6px}
.track{display:flex;height:40px;border-radius:12px;overflow:hidden;background:var(--surface2);border:1px solid var(--line)}
.seg1,.seg2{height:100%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;transition:width .7s cubic-bezier(.2,.7,.2,1);white-space:nowrap;overflow:hidden}
.seg1{background:var(--hot);color:#1d0b02}.seg2{background:var(--cold);color:#031826}
.sl{width:100%;accent-color:var(--cold);height:30px}
.big{font:700 clamp(18px,3.6vw,26px)/1.2 var(--display);font-variant-numeric:tabular-nums}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:700}
.lg span{display:flex;gap:8px;align-items:center}.lg i{width:14px;height:14px;border-radius:4px}

/* history */
.tl{position:relative;display:grid;gap:14px;padding-left:26px}
.tl::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--cold),var(--hot))}
.tl .it{position:relative}
.tl .it::before{content:"";position:absolute;left:-26px;top:14px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:3px solid var(--fg)}
.it .yr{font:700 12px var(--display);color:var(--cold);letter-spacing:.04em}
.it h3{margin:2px 0 4px}.it p{font-size:14.5px;color:var(--muted)}
.cab{width:min(100%,220px);height:auto;margin:0 auto;display:block}
.drip{animation:drip 2s ease-in infinite;fill:var(--cold)}
@keyframes drip{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(60px);opacity:0}}

/* calc */
.fx{font-family:"Manrope",monospace;font-variant-numeric:tabular-nums}
.step{padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:none;font-size:clamp(15px,2.6vw,18px);overflow-wrap:anywhere}
.step.on{display:block;animation:rise .5s both}
.step.final{background:color-mix(in srgb,var(--ok) 16%,var(--surface));border-color:color-mix(in srgb,var(--ok) 55%,transparent);font-weight:800}
.task{font-size:clamp(16px,2.6vw,19px)}

/* quiz */
.qbox{max-width:780px;margin:0 auto;display:grid;gap:14px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;font-size:14px}
.score{font:700 18px var(--display);font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;gap:10px}
.timer .tb{flex:1;height:12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.timer .tb i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--hot),var(--cold));transform-origin:left;border-radius:12px}
.timer b{font:700 20px var(--display);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.qtext{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);font:700 clamp(17px,3.4vw,24px)/1.3 var(--display);text-align:center;text-wrap:balance;min-height:110px;display:grid;place-items:center}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{border:0;border-radius:14px;cursor:pointer;min-height:92px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:left;font-weight:800;font-size:clamp(13.5px,3.4vw,18px);line-height:1.25;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:transform .12s,opacity .25s,filter .25s;overflow-wrap:anywhere}
.ans:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.3)}
.ans svg{flex:none;width:24px;height:24px;fill:currentColor}
.ans[data-c="0"]{background:var(--a1)}.ans[data-c="1"]{background:var(--a2)}.ans[data-c="2"]{background:var(--a3);color:var(--a3ink)}.ans[data-c="3"]{background:var(--a4)}
.ans.dim{opacity:.3;filter:saturate(.5)}
.ans.right{outline:4px solid var(--ok);outline-offset:2px;animation:pop .5s}
.ans.wrong{animation:shake .45s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.feed{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.feed .res{font:700 18px var(--display)}
.feed .res small{display:block;font:600 13px var(--body);color:var(--muted);margin-top:2px}
.feed .ok{color:var(--ok)}.feed .no{color:var(--bad)}
.intro{text-align:center;display:grid;gap:16px;justify-items:center;padding-top:6px}
.nick{width:min(100%,320px);padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:700 16px var(--body);text-align:center}
.nick:focus{border-color:var(--cold);outline:none}
.pin{font:700 14px var(--display);letter-spacing:.3em;color:var(--muted)}
.end{text-align:center;display:grid;gap:14px;justify-items:center}
.end .pts{font:700 clamp(44px,12vw,84px)/1 var(--display);background:linear-gradient(90deg,var(--cold),var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;font-variant-numeric:tabular-nums}
.rank{font:700 clamp(16px,3.4vw,22px) var(--display)}
.dots9{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots9 i{width:16px;height:16px;border-radius:50%;background:var(--bad)}.dots9 i.g{background:var(--ok)}
canvas#conf{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* bottom nav */
.bot{padding-block:8px 10px;justify-content:space-between}
.dots{display:flex;gap:7px;align-items:center}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:var(--line);cursor:pointer;transition:width .3s,background .3s}
.dots button[aria-current="true"]{width:26px;border-radius:9px;background:linear-gradient(90deg,var(--cold),var(--hot))}
.mid2{display:grid;justify-items:center;gap:6px;min-width:0}
.ft{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.ft small{color:var(--muted);font-weight:700;margin-left:6px}
@media (max-width:420px){.brand span{display:none}.ans{min-height:84px}.duo{grid-template-columns:1fr 46px 1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important;transition-delay:0s!important}
  .slide{transform:none}
}
</style>

<div class="app" id="app">
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="glow" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="lc"><circle cx="16" cy="16" r="14"/></clipPath></defs><g clip-path="url(#lc)"><rect width="16" height="32" fill="var(--cold)"/><rect x="16" width="16" height="32" fill="var(--hot)"/></g><circle cx="16" cy="16" r="14" fill="none" stroke="var(--fg)" stroke-width="2"/><path d="M8 20q4-8 8-4t8-4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span data-t="brand">Fizika</span>
    </div>
    <div class="tools">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="lt" aria-pressed="true">LT</button>
        <button type="button" data-lang="ru" aria-pressed="false">RU</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>
  <div class="prog" aria-hidden="true"><i id="progFill"></i></div>

  <main class="stage" id="stage">

    <!-- 0 HERO -->
    <section class="slide" data-name="start">
      <div class="wrap">
